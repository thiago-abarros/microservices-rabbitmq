# k8s/user-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
        - name: user
          image: user:ci
          imagePullPolicy: Never
          ports:
            - containerPort: ${{ secrets.SERVER_PORT_USER }}
          env:
            - name: SERVER_PORT_USER
              valueFrom:
                configMapKeyRef:
                  name: user-config
                  key: SERVER_PORT_USER
            - name: SPRING_RABBITMQ_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: user-config
                  key: SPRING_RABBITMQ_ADDRESS
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: user-secrets
                  key: DB_URL
            - name: API_SECURITY_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-secrets
                  key: API_SECURITY_TOKEN_SECRET
            - name: SONAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sonar-secret
                  key: SONAR_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user
  ports:
    - protocol: TCP
      port: ${{ secrets.SERVER_PORT_USER }}
      targetPort: ${{ secrets.SERVER_PORT_USER }}