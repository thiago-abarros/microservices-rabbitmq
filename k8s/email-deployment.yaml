apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email
  template:
    metadata:
      labels:
        app: email
    spec:
      containers:
        - name: email
          image: email:ci
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: email-config
                  key: SERVER_PORT_EMAIL
            - name: SPRING_RABBITMQ_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: email-config
                  key: SPRING_RABBITMQ_ADDRESS
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: email-secrets
                  key: DB_URL
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: email-secrets
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: email-secrets
                  key: MAIL_PASSWORD
            - name: SONAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sonar-secret
                  key: SONAR_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: email-service
spec:
  selector:
    app: email
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080