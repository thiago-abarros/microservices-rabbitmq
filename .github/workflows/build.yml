name: CI / CD

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  ci-cd:
    name: Build, Test, Sonar, and Deploy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ email, user ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build, Test & Sonar — ${{ matrix.module }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker buildx build \
            --file ${{ matrix.module }}/Dockerfile \
            --build-arg MODULE_NAME=${{ matrix.module }} \
            --build-arg ${{ matrix.module == 'email' && 'EMAIL_PORT=SERVER_PORT_EMAIL' || 'USER_PORT=SERVER_PORT_USER' }}=${{ matrix.module == 'email' && secrets.SERVER_PORT_EMAIL || secrets.SERVER_PORT_USER }} \
            --tag ${{ matrix.module }}:ci \
            --cache-from=type=inline \
            --cache-to=type=inline \
            --load \
            --build-context ${{ matrix.module }} \
            --build-env SONAR_TOKEN=${{ secrets.SONAR_TOKEN }}

      - name: Verificar segredos
        run: |
          if [ -z "${{ secrets.DB_URL }}" ]; then echo "EMAIL_DB_URL não definido"; exit 1; fi
          if [ -z "${{ secrets.MAIL_USERNAME }}" ]; then echo "EMAIL_MAIL_USERNAME não definido"; exit 1; fi
          if [ -z "${{ secrets.MAIL_PASSWORD }}" ]; then echo "EMAIL_MAIL_PASSWORD não definido"; exit 1; fi
          if [ -z "${{ secrets.DB_URL }}" ]; then echo "USER_DB_URL não definido"; exit 1; fi
          if [ -z "${{ secrets.API_SECURITY_TOKEN_SECRET }}" ]; then echo "USER_API_SECURITY_TOKEN_SECRET não definido"; exit 1; fi

      - name: Install kind
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64 \
          && chmod +x kind && sudo mv kind /usr/local/bin/

      - name: Create kind cluster
        run: kind create cluster --name ci-test --wait 5m

      - name: Load images to Kind
        run: |
          kind load docker-image email:ci --name ci-test
          kind load docker-image user:ci --name ci-test

      - name: Gerar email-configmap.yaml
        run: |
          cat <<EOF > k8s/email-configmap.yaml
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: email-config
          data:
            SERVER_PORT_EMAIL: "${{ secrets.SERVER_PORT_EMAIL }}"
            SPRING_RABBITMQ_ADDRESS: "${{ secrets.RABBITMQ_URL }}"
          EOF

      - name: Gerar user-configmap.yaml
        run: |
          cat <<EOF > k8s/user-configmap.yaml
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: user-config
          data:
            SERVER_PORT_USER: "${{ secrets.SERVER_PORT_USER }}"
            SPRING_RABBITMQ_ADDRESS: "${{ secrets.RABBITMQ_URL }}"
          EOF

      - name: Gerar sonar-secret.yaml
        run: |
          cat <<EOF > k8s/sonar-secret.yaml
          apiVersion: v1
          kind: Secret
          metadata:
            name: sonar-secret
          type: Opaque
          data:
            SONAR_TOKEN: $(echo -n "${{ secrets.SONAR_TOKEN }}" | base64)
          EOF

      - name: Gerar email-secrets.yaml
        run: |
          cat <<EOF > k8s/email-secrets.yaml
          apiVersion: v1
          kind: Secret
          metadata:
            name: email-secrets
          type: Opaque
          data:
            DB_URL: $(echo -n "${{ secrets.DB_URL }}" | base64)
            MAIL_USERNAME: $(echo -n "${{ secrets.MAIL_USERNAME }}" | base64)
            MAIL_PASSWORD: $(echo -n "${{ secrets.MAIL_PASSWORD }}" | base64)
          EOF

      - name: Gerar user-secrets.yaml
        run: |
          cat <<EOF > k8s/user-secrets.yaml
          apiVersion: v1
          kind: Secret
          metadata:
            name: user-secrets
          type: Opaque
          data:
            DB_URL: $(echo -n "${{ secrets.DB_URL }}" | base64)
            API_SECURITY_TOKEN_SECRET: $(echo -n "${{ secrets.API_SECURITY_TOKEN_SECRET }}" | base64)
          EOF

      - name: Install Skaffold
        run: |
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64 \
          && chmod +x skaffold \
          && sudo mv skaffold /usr/local/bin/

      - name: Skaffold run
        run: skaffold run --filename skaffold.yaml

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name ci-test